<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learner AI | World Ready</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="header-left">
        <div class="status-dot"></div>
        <h2>Learner AI</h2>
        <span>World Ready</span>
      </div>
      <button class="header-btn" id="resetBtn">Change Subject</button>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
      <button id="hintBtn" class="hint-btn" type="button">💡 Hint</button>
      <input type="text" id="userInput" placeholder="Select a subject first..." autocomplete="off">
      <button id="sendBtn" class="send-btn">Send</button>
    </div>
  </div>

  <script src="https://puter.com"></script>
  <script src="script.js"></script>
</body>
</html>
